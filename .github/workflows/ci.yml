name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      smoke_test_clientes:
        description: "Numero de clientes para el smoke test (default 100, escalar para prueba de carga manual)"
        default: "100"
      smoke_test_meses:
        description: "Numero de meses para el smoke test"
        default: "2"

# Un push nuevo a la misma rama o PR cancela la corrida anterior, que ya
# quedo obsoleta. En develop y main no se cancela: cada merge se verifica.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Job rapido, sin Java/PySpark: corre en segundos, siempre primero.
  lint:
    name: Lint (flake8 + black) y escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run flake8 . --max-line-length=100 --exclude=.venv
      - run: uv run black --check . --exclude=.venv

      # Ningun secreto ni archivo de datos versionado. detect-secrets
      # busca credenciales por patron (llaves de nube, contrasenas en
      # texto) y por entropia (cadenas aleatorias largas). Solo revisa
      # archivos versionados; uv.lock se excluye porque sus hashes de
      # paquetes son cadenas de alta entropia legitimas.
      - name: Escaneo de secretos y archivos de datos
        run: |
          git ls-files -z | grep -zv '^uv.lock$' \
            | xargs -0 uvx detect-secrets==1.5.0 scan > /tmp/secretos.json
          uv run python -c "
          import json, sys
          hallazgos = json.load(open('/tmp/secretos.json'))['results']
          for archivo, items in hallazgos.items():
              for item in items:
                  print(f'{archivo}:{item[\"line_number\"]} {item[\"type\"]}')
          sys.exit(1 if hallazgos else 0)
          "
          if git ls-files | grep -E '\.(csv|parquet|duckdb|joblib)$|(^|/)\.env$'; then
            echo "ERROR: hay archivos de datos o .env versionados"
            exit 1
          fi
          echo "Sin secretos ni archivos de datos versionados"

  # Job de validacion sintactica de Docker Compose, sin build de imagenes.
  # No requiere Docker Desktop completo, solo el CLI - rapido.
  docker-compose-validate:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck viene preinstalado en ubuntu-latest.
      - name: Lint de scripts de arranque
        run: shellcheck setup.sh demo.sh
      # Se usa el mismo setup.sh que corre un usuario nuevo, en vez de un
      # .env escrito a mano: si setup.sh deja de generar una variable que
      # docker-compose.yml espera, este job lo detecta.
      - name: Generar .env con setup.sh
        run: bash setup.sh
      - run: docker compose config --quiet

  # Pruebas unitarias del motor de validacion. Corre en paralelo a lint
  # y docker-compose-validate porque no depende de ninguno de los dos.
  unit-tests:
    # El nombre es el del check requerido en la regla de develop y main
    # (proteccion-develop-main): si cambia aqui, hay que cambiarlo alla en el
    # mismo momento, o los PR quedan esperando un check que nunca llega.
    name: Pruebas unitarias (motor de validacion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      # El grupo dashboard trae Streamlit y argon2-cffi para las pruebas de
      # las vistas con AppTest (tests/test_moneda_mxn.py) y del login
      # (tests/test_acceso.py), sobre el Gold de las fixtures.
      - run: uv sync --frozen --group dashboard
      # En CI estan todas las dependencias (Java, Streamlit, argon2, libomp
      # de Linux), asi que ninguna prueba deberia omitirse. Un importorskip
      # que se dispara por una dependencia faltante dejaria pasar el job en
      # verde sin probar nada; por eso cualquier "skipped" falla aqui.
      - name: Pruebas (sin omitidas)
        run: |
          set -o pipefail
          uv run --group dashboard pytest tests/ -v -rs | tee /tmp/pytest.log
          if tail -n 1 /tmp/pytest.log | grep -qE '[0-9]+ skipped'; then
            echo "ERROR: hay pruebas omitidas en CI (ver resumen arriba)"
            exit 1
          fi

  # Smoke test del pipeline completo con volumen pequeno, para que sea
  # rapido en cada PR. El volumen es parametrizable via
  # workflow_dispatch para correr una prueba de carga mas grande
  # manualmente sin tocar el trigger automatico de PR.
  pipeline-smoke-test:
    name: Pipeline Bronze -> Silver -> Gold (smoke test)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      # Valor de prueba, publico a proposito: en CI no hay datos reales
      # que proteger. En cada maquina, setup.sh genera uno aleatorio.
      PII_HASH_SALT: valor-de-prueba-solo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen

      - name: Generar fuentes sinteticas (volumen reducido)
        run: |
          uv run python generate_synthetic_sources.py \
            --clientes ${{ github.event.inputs.smoke_test_clientes || '100' }} \
            --meses ${{ github.event.inputs.smoke_test_meses || '2' }} \
            --out data/raw_sources

      # Misma sesion, dos comprobaciones: (1) una segunda corrida con los
      # mismos parametros reutiliza la sesion en vez de regenerarla, y
      # (2) regenerarla desde cero en otra carpeta produce archivos
      # identicos byte por byte (mismos checksums en el manifest).
      - name: Verificar reproducibilidad de la sesion de datos
        run: |
          ARGS="--clientes ${{ github.event.inputs.smoke_test_clientes || '100' }} \
            --meses ${{ github.event.inputs.smoke_test_meses || '2' }}"
          uv run python generate_synthetic_sources.py $ARGS --out data/raw_sources \
            | tee /tmp/segunda_corrida.log
          grep -q "se reutiliza" /tmp/segunda_corrida.log

          uv run python generate_synthetic_sources.py $ARGS \
            --sesiones-dir /tmp/sesiones_copia --out /tmp/activa_copia
          uv run python -c "
          import json, sys
          a = json.load(open('data/raw_sources/manifest.json'))
          b = json.load(open('/tmp/activa_copia/manifest.json'))
          if a['archivos'] != b['archivos']:
              print('ERROR: la misma sesion generada dos veces produjo archivos distintos')
              sys.exit(1)
          print(f'Sesion {a[\"sesion_id\"]} reproducible: {len(a[\"archivos\"])} archivos identicos')
          "

      - name: Ingesta Bronze
        run: uv run python ingest_bronze.py --source data/raw_sources --out data/bronze

      # Ingesta incremental con Delta real: (1) reingerir la misma sesion
      # no agrega nada; (2) una entrega con un mes adicional agrega solo
      # ese mes, sin duplicar clientes ni meses anteriores.
      - name: Verificar ingesta incremental de Bronze
        run: |
          uv run python ingest_bronze.py --source data/raw_sources --out data/bronze \
            | tee /tmp/reingesta.log
          grep -q "No hay archivos nuevos" /tmp/reingesta.log

          uv run python generate_synthetic_sources.py \
            --clientes ${{ github.event.inputs.smoke_test_clientes || '100' }} \
            --meses ${{ github.event.inputs.smoke_test_meses || '2' }} \
            --meses-adicionales 1 --out data/raw_sources
          uv run python ingest_bronze.py --source data/raw_sources --out data/bronze

          uv run python -c "
          import json, sys
          from src.common.spark_session import get_spark_session

          esperado = json.load(open('data/raw_sources/manifest.json'))['conteos']
          spark = get_spark_session('verificar_incremental')
          tx = spark.read.format('delta').load('data/bronze/transacciones').count()
          cl = spark.read.format('delta').load('data/bronze/clientes').count()
          spark.stop()
          if tx != esperado['transacciones'] or cl != esperado['clientes']:
              print(f'ERROR: Bronze tx={tx} clientes={cl}, esperado {esperado}')
              sys.exit(1)
          print(f'Incremental OK: {tx} transacciones y {cl} clientes, sin duplicados')
          "

      # Lineas de CSV mal formadas con Delta real, aparte del flujo principal:
      # una copia de las fuentes (sin manifest, para que cuente como entrega
      # local nueva) con una linea con columna de mas en transacciones. Bronze
      # debe guardarla en _corrupt_record y dejar intactas las demas.
      - name: Verificar que Bronze conserva las lineas mal formadas
        run: |
          rm -rf /tmp/fuente_corrupta /tmp/bronze_corrupto
          cp -R data/raw_sources /tmp/fuente_corrupta
          rm /tmp/fuente_corrupta/manifest.json
          ARCHIVO=$(ls /tmp/fuente_corrupta/transacciones/*.csv | head -n 1)
          LINEAS=$(($(wc -l < "$ARCHIVO") - 1))
          echo "TX-MALFORMADA,CTA-X,CLI-X,2026-09-01,compra,comida,-10.0,Tienda,,EXTRA" >> "$ARCHIVO"
          uv run python ingest_bronze.py --source /tmp/fuente_corrupta --out /tmp/bronze_corrupto \
            | tee /tmp/ingesta_corrupta.log
          grep -q "linea(s) mal formada(s)" /tmp/ingesta_corrupta.log
          uv run python -c "
          import sys
          from pyspark.sql import functions as F
          from src.common.spark_session import get_spark_session

          spark = get_spark_session('verificar_corruptos')
          tx = spark.read.format('delta').load('/tmp/bronze_corrupto/transacciones').cache()
          archivo = '$(basename "$ARCHIVO")'
          del_archivo = tx.filter(F.col('_source_file') == archivo)
          corruptas = del_archivo.filter(F.col('_corrupt_record').isNotNull()).collect()
          total = del_archivo.count()
          spark.stop()
          if len(corruptas) != 1 or 'TX-MALFORMADA' not in corruptas[0]['_corrupt_record']:
              print(f'ERROR: se esperaba 1 linea mal formada en {archivo}, hay {len(corruptas)}')
              sys.exit(1)
          if total != $LINEAS + 1:
              print(f'ERROR: {archivo} tiene {total} filas en Bronze, se esperaban $LINEAS + 1')
              sys.exit(1)
          print(f'Bronze conserva la linea mal formada de {archivo}; {total - 1} filas bien formadas')
          "

      - name: Transformacion Silver
        run: |
          uv run python transform_silver.py \
            --bronze data/bronze --silver data/silver \
            --quarantine data/silver_quarantine \
            --rules config/business_rules.yaml

      - name: Verificar que Silver se genero sin cuarentena inesperada
        run: |
          if [ -d "data/silver_quarantine" ]; then
            echo "Se genero cuarentena en el smoke test - revisar antes de continuar"
            find data/silver_quarantine -type f
            exit 1
          fi
          echo "Smoke test completado sin cuarentena, como se espera con datos limpios"

      # Ningun campo sensible de config/politica_pii.yaml puede existir en
      # claro en Silver ni en su cuarentena.
      - name: Verificar que Silver no contiene PII en claro
        run: |
          uv run python -c "
          import sys, yaml
          from src.common.spark_session import get_spark_session

          politica = yaml.safe_load(open('config/politica_pii.yaml'))
          spark = get_spark_session('verificar_pii')
          errores = []
          for entidad, reglas in politica.items():
              sensibles = set(reglas.get('hash_y_mascara', {}))
              sensibles |= set(reglas.get('solo_hash', []))
              sensibles |= set(reglas.get('descartar', []))
              columnas = set(spark.read.format('delta').load(f'data/silver/{entidad}').columns)
              if sensibles & columnas:
                  errores.append(f'{entidad}: {sorted(sensibles & columnas)}')
          spark.stop()
          if errores:
              print('ERROR: PII en claro en Silver:', errores)
              sys.exit(1)
          print('Silver sin PII en claro:', sorted(politica))
          "

      # El registro historico de calidad existe desde la primera corrida
      # (aunque no haya rechazos) y tiene perfil para las 4 entidades.
      - name: Verificar registro de calidad
        run: |
          uv run python -c "
          import sys
          from src.common.spark_session import get_spark_session

          spark = get_spark_session('verificar_calidad')
          perfil = spark.read.format('delta').load('data/calidad/perfil_columnas')
          incid = spark.read.format('delta').load('data/calidad/incidencias')
          entidades = {f.entidad for f in perfil.select('entidad').distinct().collect()}
          n_incid = incid.count()
          spark.stop()
          esperadas = {'clientes', 'cuentas', 'cetes_inversiones', 'transacciones'}
          if entidades != esperadas:
              print(f'ERROR: perfil de calidad para {entidades}, se esperaban {esperadas}')
              sys.exit(1)
          print(f'Registro de calidad OK: perfil de {len(entidades)} entidades, {n_incid} incidencias')
          "
          uv run python quality_report.py

      # Atomicidad de Silver: una corrida que falla a la mitad no deja la
      # capa mezclada entre dos corridas. Trabaja sobre copias, para no
      # alterar lo que verifican los pasos siguientes. A la copia de Bronze
      # le falta transacciones: Silver escribe clientes, cuentas y cetes,
      # falla al leer transacciones y debe devolver las tres a su version
      # anterior con el time travel de Delta.
      - name: Verificar que una corrida fallida de Silver se revierte
        run: |
          rm -rf /tmp/bronze_incompleto /tmp/silver_copia
          cp -r data/bronze /tmp/bronze_incompleto
          rm -rf /tmp/bronze_incompleto/transacciones
          cp -r data/silver /tmp/silver_copia

          if uv run python transform_silver.py \
              --bronze /tmp/bronze_incompleto --silver /tmp/silver_copia \
              --quarantine /tmp/cuarentena_fallo --logs /tmp/logs_fallo \
              --calidad /tmp/calidad_fallo; then
            echo "ERROR: Silver debio fallar sin la entidad transacciones"
            exit 1
          fi

          uv run python -c "
          import sys
          from delta.tables import DeltaTable
          from src.common.spark_session import get_spark_session

          spark = get_spark_session('verificar_rollback_silver')
          errores = []
          for entidad in ['clientes', 'cuentas', 'cetes_inversiones', 'transacciones']:
              original = spark.read.format('delta').load(f'data/silver/{entidad}')
              copia = spark.read.format('delta').load(f'/tmp/silver_copia/{entidad}')
              if original.exceptAll(copia).count() or copia.exceptAll(original).count():
                  errores.append(f'{entidad}: contenido distinto al de la corrida buena')
          for entidad in ['clientes', 'cuentas', 'cetes_inversiones']:
              ultima = DeltaTable.forPath(spark, f'/tmp/silver_copia/{entidad}').history(1)
              operacion = ultima.select('operation').first()[0]
              if operacion != 'RESTORE':
                  errores.append(f'{entidad}: ultima operacion {operacion}, se esperaba RESTORE')
          spark.stop()
          if errores:
              print('ERROR:', errores)
              sys.exit(1)
          print('Corrida fallida revertida: Silver identico a la ultima corrida buena')
          "

      - name: Transformacion Gold
        run: |
          uv run python transform_gold.py \
            --silver data/silver --out data/gold/kpis.duckdb \
            --catalog config/kpi_catalog.yaml

      - name: Verificar catalogo completo de KPIs en Gold
        run: |
          uv run python -c "
          import duckdb
          import sys

          con = duckdb.connect('data/gold/kpis.duckdb')
          n_kpis = con.execute('SELECT COUNT(DISTINCT kpi_id) FROM gold_kpis').fetchone()[0]

          if n_kpis != 12:
              print(f'ERROR: se esperaban 12 KPIs distintos, se encontraron {n_kpis}')
              sys.exit(1)

          n_filas = con.execute('SELECT COUNT(*) FROM gold_kpis').fetchone()[0]
          if n_filas == 0:
              print('ERROR: la tabla gold_kpis esta vacia')
              sys.exit(1)

          print(f'Gold verificado: {n_kpis} KPIs distintos, {n_filas} filas totales')
          "

      # Pipeline del modelo de riesgo, con el mismo volumen reducido.
      # El default del smoke test es 100 clientes (no 20) por este bloque:
      # la etiqueta de riesgo sale positiva en ~15% de los clientes, y con
      # 20 clientes el split estratificado 80/20 puede dejar el conjunto
      # de prueba sin positivos, lo que hace fallar el calculo de AUC-ROC.
      - name: Feature store (gold_features_cliente)
        run: |
          uv run python build_features.py \
            --silver data/silver --gold data/gold/kpis.duckdb

      - name: Etiquetas de impago (evento posterior)
        run: |
          uv run python generate_labels.py \
            --gold data/gold/kpis.duckdb \
            --config config/etiquetas_impago.yaml \
            --auditoria-out data/auditoria/etiquetas_latentes.parquet

      # Se verifica sobre el DuckDB real que produjo el pipeline, no sobre un
      # esquema supuesto: la tabla de etiquetas tiene exactamente sus columnas,
      # ninguna tabla de Gold trae columnas del proceso latente (z, choque,
      # logit, p), y la auditoria, que si las trae, vive fuera de Gold.
      - name: Verificar etiquetas y que Gold no contenga el proceso latente
        run: |
          uv run python -c "
          import duckdb
          import pandas as pd
          import sys

          from src.gold.etiquetas_gold import verificar_esquema_gold
          from src.gold.etiquetas_impago import (
              COLUMNAS_ETIQUETAS,
              COLUMNAS_LATENTES,
              cargar_config,
          )

          GOLD = 'data/gold/kpis.duckdb'
          AUDITORIA = 'data/auditoria/etiquetas_latentes.parquet'
          cfg = cargar_config('config/etiquetas_impago.yaml')

          esquema = verificar_esquema_gold(GOLD)
          if esquema['gold_etiquetas_impago'] != COLUMNAS_ETIQUETAS:
              print('ERROR: columnas de gold_etiquetas_impago:', esquema['gold_etiquetas_impago'])
              sys.exit(1)

          con = duckdb.connect(GOLD, read_only=True)
          n_features = con.execute('SELECT COUNT(*) FROM gold_features_cliente').fetchone()[0]
          cortes = con.execute('SELECT DISTINCT fecha_corte FROM gold_features_cliente').fetchall()
          etiquetas = con.execute('SELECT * FROM gold_etiquetas_impago').fetchdf()
          con.close()

          n = len(etiquetas)
          positivos = int(etiquetas['impago_posterior'].sum())
          if n != n_features:
              print(f'ERROR: {n} etiquetas para {n_features} clientes')
              sys.exit(1)
          if not set(etiquetas['impago_posterior'].unique()) <= {0, 1} or not 0 < positivos < n:
              print(f'ERROR: etiqueta invalida, {positivos} positivos de {n}')
              sys.exit(1)
          fechas = pd.to_datetime(etiquetas['fecha_observacion']).dt.date.unique()
          if len(cortes) != 1 or len(fechas) != 1 or fechas[0] != pd.to_datetime(cortes[0][0]).date():
              print('ERROR: fecha_observacion no coincide con la fecha de corte de las features')
              sys.exit(1)
          if set(etiquetas['horizonte_meses']) != {cfg.horizonte_meses}:
              print('ERROR: horizonte_meses distinto del configurado')
              sys.exit(1)

          auditoria = pd.read_parquet(AUDITORIA)
          if set(auditoria.columns) != {'cliente_id', *COLUMNAS_LATENTES}:
              print('ERROR: columnas de la auditoria:', list(auditoria.columns))
              sys.exit(1)
          if set(auditoria['cliente_id']) != set(etiquetas['cliente_id']):
              print('ERROR: la auditoria y las etiquetas no tienen los mismos clientes')
              sys.exit(1)
          if abs(auditoria['p'].mean() - cfg.tasa_objetivo) > 1e-6:
              print('ERROR: la probabilidad media no es la tasa objetivo')
              sys.exit(1)

          print(f'Etiquetas verificadas: {positivos} de {n} con impago posterior; '
                f'{len(esquema)} tablas de Gold sin columnas del proceso latente')
          "

      - name: Entrenamiento del modelo
        run: |
          uv run python train_model.py \
            --gold data/gold/kpis.duckdb \
            --model-out models/risk_model.joblib \
            --shap-out models/shap_importancia.png

      - name: Prediccion de riesgo
        run: |
          uv run python predict_risk.py \
            --gold data/gold/kpis.duckdb \
            --model models/risk_model.joblib

      - name: Verificar probabilidad_impago en Gold
        run: |
          uv run python -c "
          import duckdb
          import sys

          con = duckdb.connect('data/gold/kpis.duckdb')
          total, con_valor, fuera_rango = con.execute('''
              SELECT
                  COUNT(*),
                  COUNT(valor_numerico),
                  COUNT(*) FILTER (WHERE valor_numerico < 0 OR valor_numerico > 1)
              FROM gold_kpis
              WHERE kpi_id = 'probabilidad_impago'
          ''').fetchone()

          if total == 0 or con_valor != total:
              print(f'ERROR: probabilidad_impago con valor en {con_valor} de {total} filas')
              sys.exit(1)
          if fuera_rango:
              print(f'ERROR: {fuera_rango} probabilidades fuera de [0, 1]')
              sys.exit(1)

          n_features = con.execute(
              'SELECT COUNT(*) FROM gold_features_cliente'
          ).fetchone()[0]
          if n_features != total:
              print(f'ERROR: gold_features_cliente con {n_features} filas, se esperaban {total}')
              sys.exit(1)

          print(f'Modelo verificado: probabilidad_impago en {con_valor}/{total} clientes')
          "

      # Las mismas comprobaciones que muestra la vista de observabilidad del
      # dashboard (dashboard/datos.py), sobre el Gold real del smoke test:
      # KPIs, feature store, score y movimientos mensuales hablan de los
      # mismos clientes y de una sola fecha de corte.
      - name: Verificar coherencia de Gold (consultas del dashboard)
        run: |
          uv run python -c "
          import sys
          from dashboard import datos

          chequeos = datos.consistencia_gold('data/gold/kpis.duckdb')
          print(chequeos.to_string(index=False))
          if not chequeos['ok'].all():
              sys.exit(1)
          flujo = datos.flujo_mensual('data/gold/kpis.duckdb')
          if flujo.empty or (flujo['entradas'] <= 0).any():
              print('ERROR: gold_movimientos_mensuales sin entradas en algun mes')
              sys.exit(1)
          print(f'Movimientos mensuales: {len(flujo)} meses')
          "

      # El simulador corre de punta a punta sobre el Gold real del smoke test
      # y sus resultados son probabilidades validas.
      - name: Simulador Monte Carlo de hipoteca
        run: |
          uv run python main.py simulate --cliente CLI-000001 --precio 900000 \
            | tee /tmp/simulacion.log
          grep -q "Probabilidad de saldo negativo" /tmp/simulacion.log
          grep -q "Capacidad hipotecaria" /tmp/simulacion.log

      # Monitoreo de deriva con el XGBoost real: la primera corrida crea la
      # referencia congelada y da PSI 0 contra si misma; la segunda la
      # reutiliza sin modificarla y agrega otra corrida al historico.
      - name: Monitoreo de deriva (PSI)
        run: |
          uv run python main.py monitor --gold data/gold/kpis.duckdb \
            --model models/risk_model.joblib --config config/monitoreo_psi.yaml
          sha256sum models/referencia_psi/ref_*/referencia.json > /tmp/referencia.sha256
          uv run python main.py monitor --gold data/gold/kpis.duckdb \
            --model models/risk_model.joblib --config config/monitoreo_psi.yaml
          sha256sum -c /tmp/referencia.sha256
          uv run python -c "
          import sys
          import duckdb

          filas = duckdb.sql('''
              SELECT run_id, COUNT(*) AS variables, MAX(ABS(psi)) AS psi_max,
                     COUNT(*) FILTER (WHERE tipo = 'score') AS scores
              FROM read_parquet('data/calidad/deriva_psi/*.parquet')
              GROUP BY run_id ORDER BY run_id
          ''').fetchall()
          print(filas)
          if len(filas) != 2:
              print(f'ERROR: se esperaban 2 corridas en el historico, hay {len(filas)}')
              sys.exit(1)
          for run_id, variables, psi_max, scores in filas:
              if scores != 1 or variables < 2:
                  print(f'ERROR: {run_id} con {variables} variables y {scores} scores')
                  sys.exit(1)
              if psi_max > 1e-9:
                  print(f'ERROR: {run_id} con PSI {psi_max} sobre los mismos datos')
                  sys.exit(1)
          print('Monitoreo verificado: 2 corridas, PSI 0 sobre los mismos datos')
          "

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: data/logs/
          retention-days: 7
