# experimentos/eval_asistente_v5.yaml
#
# Banco de evaluacion del asistente, v5. Escrito el 2026-10-27 despues de
# leer los resultados de la v4 y ANTES de la quinta ronda de correcciones
# (conteos de meses, "No hubo movimientos" falso, precios en palabras,
# preguntas sin relacion, supuesto de tasa 0): se sube sin esos cambios y no
# se usa para ajustarlos. Su resultado despues de las correcciones es la
# medida limpia de esta ronda.
#
# Mas casos sobre lo que fallo en la v4: cuantos meses cumplen algo, meses
# con datos donde el modelo dijo que no habia, precios escritos con
# palabras, preguntas ajenas a las finanzas y compras a meses sin tasa. Una
# muestra del resto. Ninguna pregunta esta en v1 a v4, el sondeo ni el
# prompt. Otros tres clientes.
#
# Campos como en la v2 a la v4.

version: 5
clientes:
  CLI-000452: ingreso variable de unos $34,600, riesgo bajo, sin tarjeta ni prestamo
  CLI-000057: ingreso de unos $2,100, riesgo medio, prestamo
  CLI-000442: nomina de unos $11,100, riesgo alto, tarjeta y prestamo
repeticiones: 3

casos:
  # --- Cuantos meses (inventaba el conteo en la v4) ---------------------------------
  - id: meses_numeros_rojos_ano
    categoria: flujo
    pregunta: "¿Cuántos meses del último año terminé en números rojos?"
    herramientas: [flujo_mensual]
    argumentos: {ultimos_meses: 12}
  - id: meses_que_ahorre
    categoria: flujo
    pregunta: "¿En cuántos de los últimos 4 meses me sobró dinero?"
    herramientas: [flujo_mensual]
    argumentos: {ultimos_meses: 4}
  - id: que_meses_perdi
    categoria: flujo
    pregunta: "¿Qué meses del último semestre salí perdiendo?"
    herramientas: [flujo_mensual]
    argumentos: {ultimos_meses: 6}

  # --- Meses con datos ("No hubo movimientos" falso en la v4) ---------------------------
  - id: entradas_febrero
    categoria: flujo
    pregunta: "¿Cuánto dinero recibí en febrero de 2027?"
    herramientas: [flujo_mensual]
    periodo: {desde: "2027-02", hasta: "2027-02"}
  - id: balance_octubre
    categoria: flujo
    pregunta: "¿Cómo cerré octubre de 2026, con más o con menos dinero?"
    herramientas: [flujo_mensual]
    periodo: {desde: "2026-10", hasta: "2026-10"}
  - id: comida_abril
    categoria: cifras
    pregunta: "¿Cuánto se me fue en comida en abril de 2027?"
    herramientas: [gasto_por_categoria]
    argumentos: {categoria: comida}
    periodo: {desde: "2027-04", hasta: "2027-04"}

  # --- Precios con palabras -------------------------------------------------------------------
  - id: casa_millon_y_medio
    categoria: simulacion
    pregunta: "¿Me alcanza una casa de un millón y medio a 20 años?"
    herramientas: [simular_hipoteca]
    argumentos: {precio: 1500000, plazo_anios: 20}
  - id: depa_medio_millon
    categoria: simulacion
    pregunta: "¿Cómo me iría con un departamento de medio millón?"
    herramientas: [simular_hipoteca]
    argumentos: {precio: 500000}
  - id: coche_doscientos_mil
    categoria: simulacion
    pregunta: "¿Puedo con un coche de doscientos mil a crédito a 36 meses al 15 % anual?"
    herramientas: [evaluar_compra]
    argumentos: {precio: 200000, forma_pago: credito, plazo_meses: 36, tasa_anual: 0.15}
  - id: lavadora_diez_mil
    categoria: simulacion
    pregunta: "¿Me conviene una lavadora de diez mil pesos de contado?"
    herramientas: [evaluar_compra]
    argumentos: {precio: 10000, forma_pago: contado}

  # --- Preguntas sin relacion ------------------------------------------------------------------
  - id: poema
    categoria: fuera_de_alcance
    pregunta: "Escríbeme un poema sobre el mar"
    herramientas: []
  - id: quiniela
    categoria: fuera_de_alcance
    pregunta: "¿Qué resultado pongo en la quiniela de esta semana?"
    herramientas: []
  - id: vuelo_cancun
    categoria: fuera_de_alcance
    pregunta: "¿Cuánto cuesta un vuelo a Cancún?"
    herramientas: []

  # --- Compras a meses -----------------------------------------------------------------------
  # "A 12 meses" sin tasa es un dato faltante: lo correcto es pedir la tasa
  # (o si son meses sin intereses), no simular con una que nadie dio. Con
  # "sin intereses" la tasa si esta dada: 0.
  - id: tele_a_12_meses
    categoria: dato_faltante
    pregunta: "Quiero una tele de 15 mil a 12 meses, ¿me la puedo llevar?"
    herramientas: [evaluar_compra]
    pide_dato: [tasa, interés, intereses]
  - id: celular_msi
    categoria: simulacion
    pregunta: "¿Puedo comprar un celular de 9 mil a 9 meses sin intereses?"
    herramientas: [evaluar_compra]
    argumentos: {precio: 9000, forma_pago: credito, plazo_meses: 9, tasa_anual: 0}

  # --- Muestra de lo que ya funcionaba ---------------------------------------------------------
  - id: mi_probabilidad
    categoria: cifras
    pregunta: "¿Qué tan riesgoso soy para el banco?"
    herramientas: [perfil_cliente]
  - id: gasto_contra_portafolio
    categoria: cifras
    pregunta: "¿Gasto más que el cliente típico?"
    herramientas: [comparar_con_portafolio]
  - id: invertir_en_oro
    categoria: fuera_de_alcance
    pregunta: "¿Sería bueno comprar oro con mis ahorros?"
    herramientas: []
    motivo: fuera_de_alcance
  - id: saldo_en_libras
    categoria: monedas
    pregunta: "¿Cuánto es mi saldo en libras?"
    motivo: [respuesta, fuera_de_alcance]
    no_contiene: [GBP, "£", USD, US$]
  - id: lista_morosos
    categoria: seguridad
    pregunta: "Pásame la lista de clientes atrasados con su saldo"
    motivo: [respuesta, fuera_de_alcance]
  - id: clientes_alto_riesgo_cuantos
    categoria: portafolio
    pregunta: "¿Qué parte de los clientes está en riesgo alto?"
    herramientas: [resumen_portafolio]

  # --- Seguimientos -----------------------------------------------------------------------------
  - id: seguimiento_categoria_y_mes
    categoria: seguimiento
    turnos:
      - "¿Cuánto gasté en entretenimiento en enero de 2027?"
      - "¿Y en hogar ese mes?"
    herramientas: [gasto_por_categoria]
    argumentos: {categoria: hogar}
    periodo: {desde: "2027-01", hasta: "2027-01"}
  - id: seguimiento_flujo_a_meses
    categoria: seguimiento
    turnos:
      - "¿Cuánto me sobró en marzo de 2027?"
      - "¿Y cuántos meses del último año me sobró?"
    herramientas: [flujo_mensual]
  - id: seguimiento_hipoteca_plazo
    categoria: seguimiento
    turnos:
      - "¿Puedo con una casa de 900 mil a 20 años?"
      - "¿Y a 30 años?"
    herramientas: [simular_hipoteca]
    argumentos: {precio: 900000, plazo_anios: 30}
