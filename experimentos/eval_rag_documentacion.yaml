    parafrasis: true
    esperado: [{archivo: docs/evaluacion-asistente.md, seccion: "Resultados"}]
  - id: d22
    pregunta: "¿Cómo se dan cuenta de que los clientes cambiaron de comportamiento con el tiempo?"
    parafrasis: true
    esperado: [{archivo: docs/monitoreo-deriva.md, seccion: ""}]
  - id: d23
    pregunta: "¿Cómo evitan que alguien suba una contraseña al repositorio?"
    parafrasis: true
    esperado:
      - {archivo: docs/seguridad.md, seccion: "Controles automaticos en CI"}
      - {archivo: docs/seguridad.md, seccion: "Secretos"}
  - id: d24
    pregunta: "¿Qué tan morosos son los clientes según el modelo?"
    parafrasis: true
    esperado:
      - {archivo: docs/diccionario-datos.md, seccion: "Modelo de riesgo"}
      - {archivo: docs/technical-debt.md, seccion: "descalibrada"}

fuera_del_corpus:
  - "¿Cuál es la capital de Francia?"
  - "¿Quién ganó el último mundial de futbol?"
  - "Dame una receta de enchiladas"
