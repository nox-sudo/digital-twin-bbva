# config/dashboard.yaml
#
# Parametros de presentacion del dashboard (dashboard/app.py). No cambian
# ningun dato de Gold: solo como se agrupan y se muestran.

# Rutas de lectura. El dashboard solo lee: abre DuckDB en modo solo
# lectura y nunca escribe en data/.
gold_duckdb: data/gold/kpis.duckdb
logs: data/logs
# Historico del monitoreo de deriva (monitor_drift.py) y su configuracion,
# de donde salen los umbrales y las variables temporales.
deriva_psi: data/calidad/deriva_psi
# Cifras de cabecera del portafolio por corte (predict_risk.py), para
# comparar el corte actual contra la base.
resumen_portafolio: data/calidad/resumen_portafolio
monitoreo_psi: config/monitoreo_psi.yaml

# Bandas de riesgo sobre probabilidad_impago. Son una decision de
# operacion (a partir de que probabilidad se revisa a un cliente), no una
# salida del modelo. Limite inferior incluido: una probabilidad de 0.10
# cae en "medio".
bandas_riesgo:
  - nombre: bajo
    desde: 0.0
  - nombre: medio
    desde: 0.10
  - nombre: alto
    desde: 0.30
