# docker-compose.yml
#
# Infraestructura local reproducible del Gemelo Digital Financiero.
# Un solo comando (bash demo.sh) levanta todo el ecosistema.
#
# Servicios:
#   postgres            metadata de Airflow
#   airflow-init        inicializa la base de datos y el usuario admin (corre una vez)
#   airflow-webserver   UI de Airflow, puerto 8080
#   airflow-scheduler   orquesta y dispara los DAGs
#   minio               almacenamiento S3-compatible, puerto 9000 (API) y 9001 (consola)
#   minio-createbucket  crea el bucket inicial una sola vez
#   worker              imagen con PySpark + Delta + codigo del proyecto,
#                       lanzada por Airflow via DockerOperator, o manualmente
#                       con: docker compose run --rm worker <script>.py
#
# Seguridad (detalle en docs/seguridad.md):
# - Ninguna contrasena vive en este archivo. Todas salen de .env, que
#   setup.sh genera con valores aleatorios por maquina y que nunca se
#   sube al repo. La sintaxis ${VAR:?mensaje} hace que compose se niegue
#   a arrancar si falta alguna, en vez de caer a un default inseguro.
# - Los puertos se publican solo en 127.0.0.1: la UI de Airflow y MinIO
#   son accesibles desde esta maquina, no desde la red local (por
#   ejemplo, el wifi de una cafeteria).

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Corre bash setup.sh}@postgres/airflow"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Mexico_City
    # Cifra las conexiones y variables que Airflow guarda en su base de
    # datos. Sin ella, quedan en texto plano en Postgres.
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?Corre bash setup.sh}"
    # Firma las cookies de sesion de la UI.
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:?Corre bash setup.sh}"
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-docker"
    # Ruta host real del proyecto, para que el DAG pueda montar rutas
    # correctas al lanzar contenedores hermanos via DockerOperator.
    # Ver nota en .env.example sobre por que esto es necesario.
    HOST_PROJECT_DIR: "${HOST_PROJECT_DIR}"
    # Secretos que el DAG reenvia al worker (como private_environment,
    # que Airflow no muestra en la UI ni en los logs).
    PII_HASH_SALT: "${PII_HASH_SALT:?Corre bash setup.sh}"
    MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Corre bash setup.sh}"
    MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Corre bash setup.sh}"
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    # Riesgo aceptado: el socket de Docker da control total sobre el
    # Docker del host. Es lo que permite a Airflow lanzar el worker
    # (DockerOperator); ver docs/seguridad.md.
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  # Grupo dueno del socket de Docker en el host. En Linux el socket
  # pertenece al grupo "docker" (GID variable por maquina); sin este
  # grupo, Airflow no puede lanzar el worker (permission denied). En
  # Mac/Windows con Docker Desktop el socket ya es accesible y basta 0.
  # setup.sh detecta el valor correcto y lo escribe en .env.
  group_add:
    - "${DOCKER_GID:-0}"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Corre bash setup.sh}"
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Corre bash setup.sh}"
    entrypoint: /bin/bash
    command:
      - -c
      # La contrasena se lee de la variable de entorno dentro del
      # contenedor ($$ evita que compose la sustituya en este texto).
      - |
        exec /entrypoint bash -c '
          airflow db migrate &&
          airflow users create \
            --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname Admin --lastname Gemelo \
            --role Admin --email admin@example.com
        '
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Corre bash setup.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Corre bash setup.sh}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      # Carpeta del host, no volumen de Docker: el historico de la zona
      # de aterrizaje sobrevive a "docker compose down -v" y a
      # "demo.sh limpiar". data/ esta fuera del repo (.gitignore).
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  minio-createbucket:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Corre bash setup.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Corre bash setup.sh}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p local/gemelo-digital-financiero &&
      exit 0
      "

  worker:
    build: .
    image: gemelo-worker:local
    environment:
      DATA_ROOT: /opt/lakehouse/data
      SPARK_MASTER_URL: local[*]
      PII_HASH_SALT: "${PII_HASH_SALT:?Corre bash setup.sh}"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Corre bash setup.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Corre bash setup.sh}"
    volumes:
      - ./data:/opt/lakehouse/data
      - ./config:/opt/lakehouse/config
      - ./models:/opt/lakehouse/models
    # Sin comando por defecto: se invoca puntualmente con
    # docker compose run --rm worker <script>.py [args], o desde Airflow.

# Nombre fijo de la red: el DAG lanza el worker en esta misma red para
# que pueda resolver "minio" por nombre. Sin nombre fijo, compose la
# llama <carpeta>_default y cambiaria segun donde se clone el repo.
networks:
  default:
    name: gemelo-net

volumes:
  postgres_data:
  airflow_logs:
