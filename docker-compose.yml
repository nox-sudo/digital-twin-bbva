# docker-compose.yml
#
# Infraestructura local reproducible del Gemelo Digital Financiero.
# Un solo comando (docker compose up --build) levanta todo el ecosistema.
#
# Servicios:
#   postgres           metadata de Airflow
#   airflow-init       inicializa la base de datos y el usuario admin (corre una vez)
#   airflow-webserver  UI de Airflow, puerto 8080
#   airflow-scheduler  orquesta y dispara los DAGs
#   minio              almacenamiento S3-compatible, puerto 9000 (API) y 9001 (consola)
#   minio-createbucket  crea el bucket inicial una sola vez
#   worker             imagen con PySpark + Delta + codigo del proyecto,
#                      lanzada por Airflow via DockerOperator, o manualmente
#                      con: docker compose run --rm worker <script>.py

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Mexico_City
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-docker"
    # Ruta host real del proyecto, para que el DAG pueda montar rutas
    # correctas al lanzar contenedores hermanos via DockerOperator.
    # Ver nota en .env.example sobre por que esto es necesario.
    HOST_PROJECT_DIR: "${HOST_PROJECT_DIR}"
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        exec /entrypoint bash -c "
          airflow db migrate &&
          airflow users create \
            --username admin --password admin \
            --firstname Andrew --lastname Tran \
            --role Admin --email admin@example.com
        "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/gemelo-digital-financiero &&
      exit 0
      "

  worker:
    build: .
    image: gemelo-worker:local
    environment:
      DATA_ROOT: /opt/lakehouse/data
      SPARK_MASTER_URL: local[*]
    volumes:
      - ./data:/opt/lakehouse/data
      - ./config:/opt/lakehouse/config
    # Sin comando por defecto: se invoca puntualmente con
    # docker compose run --rm worker <script>.py [args], o desde Airflow.

volumes:
  postgres_data:
  airflow_logs:
  minio_data:
